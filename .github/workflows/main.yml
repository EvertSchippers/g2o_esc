name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build native library
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j

    - name: Test
      run: dotnet test Fugro/Test/Fugro.G2O.Test.csproj -c Release

    - name: Upload native library
      uses: actions/upload-artifact@v4
      with:
        name: native-linux-x64
        path: build/bin/libfugro_g2o.so

  windows:
    runs-on: windows-latest
    needs: linux
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build native library
      run: |
        cmake -S . -B build -A x64
        cmake --build build --config Release

    - name: Test
      run: dotnet test Fugro/Test/Fugro.G2O.Test.csproj -c Release

    - name: Download Linux native library
      uses: actions/download-artifact@v4
      with:
        name: native-linux-x64
        path: build/bin

    - name: Pack
      run: dotnet pack Fugro/G2O.NET/Fugro.G2O.csproj -c Release -o packages

    - name: Publish
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: packages/*.nupkg
